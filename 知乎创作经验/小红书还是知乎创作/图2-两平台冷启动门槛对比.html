<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  body { margin:0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:#f6f7f9; }
  .wrap { width: 1000px; padding: 40px; box-sizing: border-box; }
  h2 { font-size: 30px; color: #1a1a1a; margin: 0 0 28px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  th, td { padding: 18px 20px; font-size: 17px; text-align: left; border-bottom: 1px solid #eef0f4; vertical-align: top; line-height: 1.6; }
  th { background: #175199; color: #fff; font-size: 18px; }
  td.dim { font-weight: 700; color: #1a1a1a; width: 130px; background: #fafbfd; }
  td .small { display:block; font-size: 13px; color: #8590a6; font-weight: 400; margin-top: 4px; }
  tr:last-child td { border-bottom: none; }
  .hl { color: #175199; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h2>新手冷启动：两个平台的三道门槛</h2>
  <table>
    <tr><th style="width:130px"></th><th>知乎</th><th>小红书</th></tr>
    <tr>
      <td class="dim">选题</td>
      <td><span class="hl">现成题库</span>：关注的问题、邀请回答里有源源不断的题，挑会答的即可</td>
      <td>全部自己造：选题、封面、标题缺一不可</td>
    </tr>
    <tr>
      <td class="dim">配图</td>
      <td><span class="hl">要求宽松</span>：实拍、信息图、纯文字长文都行</td>
      <td>封面定生死：图不够精致，内容再好也可能没人点开</td>
    </tr>
    <tr>
      <td class="dim">正反馈</td>
      <td><span class="hl">新人单篇也有机会起量</span>：小号认真作答，冲到几千上万阅读并不稀奇</td>
      <td>流量分配偏玄学：认真写可能没人看，随手发反而爆了</td>
    </tr>
  </table>
</div>
</body>
</html>
