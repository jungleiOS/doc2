<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    background: linear-gradient(160deg, #0A1A0A 0%, #152A1A 50%, #0D1F12 100%);
    font-family: "PingFang SC", sans-serif;
    padding: 48px 60px;
    color: #E8E6E1;
  }
  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  .tag {
    display: inline-block;
    background: #4ADE80;
    color: #0A1A0A;
    font-size: 14px;
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 4px;
    margin-bottom: 12px;
  }
  h2 {
    font-family: "Songti SC", serif;
    font-size: 38px;
    font-weight: 900;
    line-height: 1.3;
  }
  .img-row {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 28px;
  }
  .img-box {
    width: 320px;
    height: 400px;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    position: relative;
  }
  .img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(1.08) contrast(1.05) saturate(0.85) sepia(0.1);
  }
  .img-box::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(10,26,10,0.1) 0%, transparent 40%, rgba(10,26,10,0.3) 100%);
    pointer-events: none;
  }
  .dim-label {
    position: absolute;
    bottom: 16px;
    left: 16px;
    right: 16px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    border-radius: 8px;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 2;
  }
  .dim-label .name {
    font-size: 15px;
    color: #8B8680;
  }
  .dim-label .val {
    font-family: "Menlo", monospace;
    font-size: 22px;
    font-weight: 700;
    color: #4ADE80;
  }
  .callouts {
    display: flex;
    justify-content: center;
    gap: 20px;
  }
  .callout-item {
    background: rgba(74,222,128,0.08);
    border: 1px solid rgba(74,222,128,0.2);
    border-radius: 10px;
    padding: 14px 22px;
    text-align: center;
    flex: 1;
    max-width: 280px;
  }
  .callout-item .num {
    font-family: "Menlo", monospace;
    font-size: 32px;
    font-weight: 700;
    color: #4ADE80;
  }
  .callout-item .num .unit { font-size: 18px; color: #6E8B70; }
  .callout-item .desc {
    font-size: 14px;
    color: #8B9B8B;
    margin-top: 4px;
  }
  .meta {
    text-align: center;
    font-size: 14px;
    color: #3A5A3A;
    margin-top: 24px;
  }
</style>
</head>
<body>
<div id="shot">
  <div class="header">
    <div class="tag">机身厚度</div>
    <h2>5.2mm 展开 · 史上最薄 iPhone</h2>
  </div>
  <div class="img-row">
    <div class="img-box">
      <img src="../images-duo/duo-thin.jpg" alt="iPhone Duo 多角度">
      <div class="dim-label">
        <span class="name">展开厚度</span>
        <span class="val">5.2mm</span>
      </div>
    </div>
  </div>
  <div class="callouts">
    <div class="callout-item">
      <div class="num">5.2<span class="unit">mm</span></div>
      <div class="desc">展开厚度 · 史上最薄</div>
    </div>
    <div class="callout-item">
      <div class="num">11.3<span class="unit">mm</span></div>
      <div class="desc">折叠厚度 · 常规水平</div>
    </div>
    <div class="callout-item">
      <div class="num" style="color:#FF9B9B">254<span class="unit">g</span></div>
      <div class="desc">重量 · 史上最重</div>
    </div>
  </div>
  <div class="meta">图源：Apple 官网 · 百家号数码精算重制</div>
</div>
</body>
</html>
