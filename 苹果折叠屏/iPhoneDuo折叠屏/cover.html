<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>iPhone Duo 折叠屏封面（百家号版）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 900px;
    height: 500px;
    overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
  }
  .cover {
    width: 900px;
    height: 500px;
    background: linear-gradient(135deg, #0A0C10 0%, #1A1D26 40%, #2A1F3D 100%);
    position: relative;
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  /* 背景装饰：折叠线 */
  .fold-line {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    background: linear-gradient(to bottom,
      transparent 0%,
      rgba(255,214,0,0.08) 20%,
      rgba(255,214,0,0.15) 50%,
      rgba(255,214,0,0.08) 80%,
      transparent 100%
    );
  }
  /* 背景装饰：光晕 */
  .glow {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,214,0,0.06) 0%, transparent 70%);
    top: -80px;
    right: -60px;
  }
  .glow-2 {
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(100,140,255,0.05) 0%, transparent 70%);
    bottom: -60px;
    left: -40px;
  }

  /* 左侧文字区 */
  .text-area {
    position: relative;
    z-index: 2;
    padding: 0 60px;
    width: 520px;
  }
  .tag {
    display: inline-block;
    background: #FFD600;
    color: #0A0C10;
    font-size: 15px;
    font-weight: 800;
    padding: 4px 14px;
    border-radius: 4px;
    margin-bottom: 18px;
    letter-spacing: 0.08em;
  }
  .title {
    font-family: "Songti SC", "STSong", serif;
    font-size: 52px;
    font-weight: 900;
    color: #F5F3EE;
    line-height: 1.2;
    margin-bottom: 14px;
    letter-spacing: -0.01em;
  }
  .title .yellow { color: #FFD600; }
  .subtitle {
    font-size: 22px;
    color: #9A978F;
    line-height: 1.5;
    margin-bottom: 22px;
  }
  .price-row {
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .price {
    font-family: "Menlo", "Courier New", monospace;
    font-size: 56px;
    font-weight: 700;
    color: #FFD600;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .price .cur { font-size: 28px; }
  .price-note {
    font-size: 18px;
    color: #6E6B63;
    line-height: 1.4;
  }

  /* 右侧：参数亮点 */
  .specs-area {
    position: absolute;
    right: 40px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    width: 290px;
  }
  .spec-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 10px;
    backdrop-filter: blur(8px);
  }
  .spec-card .val {
    font-family: "Menlo", "Courier New", monospace;
    font-size: 28px;
    font-weight: 700;
    color: #FFD600;
    line-height: 1.2;
  }
  .spec-card .val .unit {
    font-size: 16px;
    color: #8B8680;
    font-weight: 400;
  }
  .spec-card .desc {
    font-size: 14px;
    color: #8B8680;
    margin-top: 4px;
    line-height: 1.4;
  }
  .spec-card.alert {
    border-color: rgba(178,55,42,0.4);
    background: rgba(178,55,42,0.08);
  }
  .spec-card.alert .val {
    color: #FF9B9B;
  }

  /* 底部信息条 */
  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 36px;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    font-size: 13px;
    color: #5C5F66;
    z-index: 3;
  }
  .bottom-bar .source { color: #6E6B63; }
</style>
</head>
<body>
<div class="cover" id="shot">
  <div class="fold-line"></div>
  <div class="glow"></div>
  <div class="glow-2"></div>

  <div class="text-area">
    <div class="tag">2026 苹果折叠屏</div>
    <div class="title">
      iPhone Duo<br>
      <span class="yellow">值 15999 吗</span>
    </div>
    <div class="subtitle">
      史上最薄 × 史上最重<br>
      无 Face ID · 无长焦 · 6 大取舍逐项拆解
    </div>
    <div class="price-row">
      <div class="price"><span class="cur">¥</span>15,999</div>
      <div class="price-note">起<br>售</div>
    </div>
  </div>

  <div class="specs-area">
    <div class="spec-card">
      <div class="val">5.2<span class="unit">mm</span></div>
      <div class="desc">展开厚度 · 史上最薄 iPhone</div>
    </div>
    <div class="spec-card">
      <div class="val">7.6<span class="unit">"</span></div>
      <div class="desc">内屏 · 展开近 iPad mini</div>
    </div>
    <div class="spec-card">
      <div class="val">A20 Pro <span class="unit">2nm</span></div>
      <div class="desc">与 iPhone 18 Pro 同款芯片</div>
    </div>
    <div class="spec-card alert">
      <div class="val">254<span class="unit">g</span></div>
      <div class="desc">史上最重 iPhone</div>
    </div>
  </div>

  <div class="bottom-bar">
    <span class="source">数据截至 2026.09.10 · 来源 Apple 中国官网</span>
    <span>附三星 Z Fold 8 / 华为 Pura X Max 对比</span>
  </div>
</div>
</body>
</html>
