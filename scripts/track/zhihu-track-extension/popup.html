<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>追踪名单</title>
<style>
  body { width: 320px; margin: 0; padding: 12px; font: 13px/1.6 -apple-system, "PingFang SC", sans-serif; color: #1a1a1a; }
  h3 { margin: 0 0 8px; font-size: 14px; }
  .empty { color: #8590a6; padding: 16px 0; text-align: center; }
  .item { display: flex; align-items: center; gap: 8px; padding: 8px 6px; border-bottom: 1px solid #f0f0f0; }
  .item:last-child { border-bottom: none; }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 600; }
  .name a { color: #056de8; text-decoration: none; }
  .meta { color: #8590a6; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { flex: none; padding: 2px 10px; font-size: 12px; border-radius: 10px; cursor: pointer;
           color: #8590a6; border: 1px solid #cfd8dc; background: #f6f8fa; }
  button:hover { color: #f1403b; border-color: #f1403b; }
  .foot { margin-top: 8px; color: #8590a6; font-size: 12px; text-align: center; }
</style>
</head>
<body>
<h3>追踪名单 <span id="count"></span></h3>
<div id="list"><div class="empty">加载中…</div></div>
<div class="foot">点「移除」即取消追踪；下次采集不再抓他</div>
<script src="popup.js"></script>
</body>
</html>
