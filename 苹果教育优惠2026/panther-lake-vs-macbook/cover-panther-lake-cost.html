<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 900px; padding: 40px; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; background: #FAFAFA; }
.title { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 24px; text-align: center; }
table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
th { background: #1a1a1a; color: #fff; padding: 14px 16px; font-size: 14px; font-weight: 600; text-align: center; }
td { padding: 14px 16px; font-size: 14px; color: #333; text-align: center; border-bottom: 1px solid #f0f0f0; }
tr:last-child td { border-bottom: none; }
.highlight { background: #F0FFF4; }
.highlight td { color: #166534; font-weight: 600; }
.price { font-size: 20px; font-weight: 700; }
.price.green { color: #16a34a; }
.price.red { color: #dc2626; }
.label { font-weight: 600; text-align: left !important; }
.note { font-size: 12px; color: #999; margin-top: 16px; text-align: center; }
</style>
</head>
<body>
<div class="title">MacBook Air M5 vs Panther Lake 旗舰本 · 两年使用成本</div>
<table>
<tr>
  <th style="width:30%">对比项</th>
  <th style="width:35%">MacBook Air M5</th>
  <th style="width:35%">Panther Lake 旗舰本</th>
</tr>
<tr>
  <td class="label">入手价</td>
  <td>¥9,249 <span style="font-size:12px;color:#666">(教育价)</span></td>
  <td>¥12,000+ <span style="font-size:12px;color:#666">(预估)</span></td>
</tr>
<tr>
  <td class="label">两年后续卖</td>
  <td class="price green">¥5,500-6,000</td>
  <td class="price red">¥3,000-3,500</td>
</tr>
<tr class="highlight">
  <td class="label">两年实际花费</td>
  <td class="price green">≈ ¥3,200</td>
  <td class="price red">≈ ¥8,500</td>
</tr>
<tr>
  <td class="label">每天成本</td>
  <td class="price green">≈ ¥4.4/天</td>
  <td class="price red">≈ ¥11.6/天</td>
</tr>
</table>
<div class="note">数据来源：苹果官网教育商店 2026.09 / 知乎 @LAWRENCE Panther Lake 旗舰本定价分析<br>Windows 本二手价参考闲鱼同价位机型均价</div>
</body>
</html>
