<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>百家号封面 · 2026 苹果返校季</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 900px;
    height: 600px;
    background: #FBF6E9;
    font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
    color: #262117;
    position: relative;
    overflow: hidden;
  }
  .frame { position: absolute; inset: 18px; border: 4px solid #262117; }
  .band {
    position: absolute;
    top: 18px; left: 18px; right: 18px;
    background: #262117;
    color: #FBF6E9;
    padding: 40px 48px 34px;
  }
  .band .tag {
    font-family: "Songti SC", "STSong", serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.5em;
    color: #D8B45A;
    margin-bottom: 14px;
  }
  .band h1 {
    font-family: "Songti SC", "STSong", serif;
    font-size: 76px;
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: 0.02em;
  }
  .band .vs {
    margin-top: 18px;
    display: flex;
    align-items: center;
    gap: 20px;
    font-family: "Songti SC", "STSong", serif;
    font-size: 34px;
    font-weight: 900;
  }
  .band .vs .x {
    background: #B2372A;
    color: #FBF6E9;
    font-family: "PingFang SC", sans-serif;
    font-size: 24px;
    font-weight: 700;
    padding: 4px 14px;
    border-radius: 999px;
  }
  .nums {
    position: absolute;
    left: 66px; right: 66px;
    bottom: 120px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-top: 3px dashed #B9A87F;
    padding-top: 26px;
  }
  .num .v {
    font-family: "Menlo", "Courier New", monospace;
    font-size: 56px;
    font-weight: 700;
    color: #B2372A;
    line-height: 1;
  }
  .num .v.dark { color: #262117; }
  .num .k { font-size: 21px; color: #6E6350; margin-top: 10px; }
  .foot {
    position: absolute;
    left: 66px; right: 66px;
    bottom: 52px;
    font-family: "Songti SC", "STSong", serif;
    font-size: 24px;
    font-weight: 700;
    color: #262117;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    white-space: nowrap;
  }
  .foot .src { font-family: "PingFang SC", sans-serif; font-size: 18px; font-weight: 400; color: #8A7E66; white-space: nowrap; }
  .stamp {
    position: absolute;
    right: 52px;
    top: 216px;
    width: 130px; height: 130px;
    border: 4px solid rgba(178, 55, 42, 0.9);
    border-radius: 50%;
    color: rgba(178, 55, 42, 0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Songti SC", "STSong", serif;
    font-weight: 900;
    transform: rotate(11deg);
  }
  .stamp::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 2px solid rgba(178, 55, 42, 0.9);
    border-radius: 50%;
  }
  .stamp .l1 { font-size: 22px; letter-spacing: 0.12em; }
  .stamp .l2 { font-size: 30px; margin-top: 2px; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="band">
    <div class="tag">返校季 · 精算实测</div>
    <h1>2026 苹果返校季</h1>
    <div class="vs"><span>官网教育优惠</span><span class="x">VS</span><span>京东国补</span></div>
  </div>
  <div class="nums">
    <div class="num"><div class="v dark">¥849</div><div class="k">返校季配件抵扣额度</div></div>
    <div class="num"><div class="v">7861.65</div><div class="k">MacBook Air 国补到手</div></div>
    <div class="num"><div class="v">2980.01</div><div class="k">入门 iPad 国补叠券到手</div></div>
  </div>
  <div class="foot">
    <span>两条路线，逐台实算，谁便宜买谁</span>
    <span class="src">数据来源：苹果官网教育商店 / 京东自营实测</span>
  </div>
  <div class="stamp"><div class="l1">延期至</div><div class="l2">9.24</div></div>
</body>
</html>
