<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>百家号封面 · 苹果折叠屏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 900px;
    height: 600px;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    background: #08080F;
  }
  .cover {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .top {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #0F1F3D 0%, #0B1830 100%);
  }
  .bottom {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #08080F;
  }
  .fold {
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    transform: translateY(-50%);
    height: 14px;
    background: linear-gradient(180deg,
      rgba(0,0,0,0.5) 0%,
      rgba(0,0,0,0.08) 35%,
      rgba(255,255,255,0.05) 50%,
      rgba(0,0,0,0.08) 65%,
      rgba(0,0,0,0.5) 100%
    );
    z-index: 2;
  }
  .frame {
    position: absolute;
    inset: 14px;
    border: 1px solid rgba(255,255,255,0.06);
    z-index: 3;
    pointer-events: none;
  }
  .t1 {
    font-size: 80px;
    font-weight: 800;
    color: #FFFFFF;
    letter-spacing: 0.08em;
  }
  .t2 {
    font-size: 80px;
    font-weight: 800;
    color: #CCFF00;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="top"><span class="t1">苹果折叠屏</span></div>
    <div class="fold"></div>
    <div class="bottom"><span class="t2">晚了六年？</span></div>
    <div class="frame"></div>
  </div>
</body>
</html>
