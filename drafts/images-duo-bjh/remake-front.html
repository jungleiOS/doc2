<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    background: linear-gradient(160deg, #0F1923 0%, #1A2A3A 50%, #0D1B2A 100%);
    font-family: "PingFang SC", sans-serif;
    padding: 48px 60px;
    color: #E8E6E1;
  }
  .wrap {
    display: flex;
    align-items: center;
    gap: 40px;
  }
  .img-box {
    flex-shrink: 0;
    width: 420px;
    height: 560px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 48px rgba(0,0,0,0.5);
    position: relative;
  }
  .img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(1.05) contrast(1.08) saturate(0.9);
  }
  .img-box::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(15,25,35,0.15) 0%, transparent 30%, transparent 70%, rgba(15,25,35,0.25) 100%);
    pointer-events: none;
  }
  .info { flex: 1; }
  .tag {
    display: inline-block;
    background: #FFD600;
    color: #0F1923;
    font-size: 14px;
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 4px;
    margin-bottom: 16px;
  }
  h2 {
    font-family: "Songti SC", serif;
    font-size: 36px;
    font-weight: 900;
    line-height: 1.3;
    margin-bottom: 20px;
  }
  .callout {
    background: rgba(255,214,0,0.08);
    border-left: 4px solid #FFD600;
    padding: 16px 20px;
    border-radius: 0 8px 8px 0;
    margin-bottom: 16px;
  }
  .callout .label {
    font-size: 13px;
    color: #FFD600;
    font-weight: 700;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
  }
  .callout .text {
    font-size: 18px;
    line-height: 1.5;
    color: #C8C5BD;
  }
  .meta {
    font-size: 14px;
    color: #5C6670;
    margin-top: 20px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div id="shot">
<div class="wrap">
  <div class="img-box">
    <img src="../images-duo/duo-front.jpg" alt="iPhone Duo 正面">
  </div>
  <div class="info">
    <div class="tag">正面实拍</div>
    <h2>屏下前置摄像头<br>5.2mm 无刘海内屏</h2>
    <div class="callout">
      <div class="label">屏下摄像头</div>
      <div class="text">内屏无刘海无挖孔，前置摄像头藏在屏幕下方。代价是自拍画质不如传统方案。</div>
    </div>
    <div class="callout">
      <div class="label">Touch ID 替代 Face ID</div>
      <div class="text">侧边电源键指纹识别，折叠态展开态均可解锁。5.2mm 机身装不下 Face ID 模组。</div>
    </div>
    <div class="meta">图源：Apple 官网 · 百家号数码精算重制</div>
  </div>
</div>
</div>
</body>
</html>
