<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720px;
    padding: 40px 44px 32px;
    background: #fdfcf9;
    font-family: "PingFang SC", "Songti SC", sans-serif;
    color: #2b2b2b;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .sub {
    margin-top: 8px;
    font-size: 14px;
    color: #8a8577;
  }
  .chart {
    margin-top: 28px;
  }
  .row {
    display: flex;
    align-items: center;
    margin-bottom: 14px;
  }
  .label {
    width: 130px;
    font-size: 15px;
    color: #4a463c;
    flex-shrink: 0;
  }
  .bar-wrap {
    flex: 1;
    position: relative;
    height: 34px;
  }
  .bar {
    height: 34px;
    border-radius: 4px;
    background: linear-gradient(90deg, #b8c4a9, #8fa276);
  }
  .bar.hot {
    background: linear-gradient(90deg, #d9a05b, #c97b3d);
  }
  .val {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    font-weight: 600;
    color: #3d3a32;
    white-space: nowrap;
  }
  .note {
    margin-top: 24px;
    padding-top: 14px;
    border-top: 1px solid #e5e0d3;
    font-size: 12.5px;
    color: #9a9484;
    line-height: 1.7;
  }
</style>
</head>
<body>
  <h1>放电越深，电池死得越快</h1>
  <div class="sub">锂电池在不同放电深度（DoD）下的循环寿命 · 容量跌到 70% 为止</div>
  <div class="chart" id="chart"></div>
  <div class="note">数据：Battery University BU-808 Table 2（钴酸锂系 NMC 电芯实测估值）· 100% DoD 指充满后放到接近关机，20% DoD 大致相当于只用掉两格电就充</div>
<script>
  const data = [
    { label: "100% DoD（用到关机）", v: 300,  hot: true },
    { label: "80% DoD",  v: 400,  hot: true },
    { label: "60% DoD",  v: 600,  hot: false },
    { label: "40% DoD（剩一半就充）", v: 1000, hot: false },
    { label: "20% DoD",  v: 2000, hot: false },
    { label: "10% DoD",  v: 6000, hot: false },
  ];
  const max = 6000;
  const chart = document.getElementById("chart");
  data.forEach(d => {
    const row = document.createElement("div");
    row.className = "row";
    const w = Math.max(d.v / max * 76, 2.5);
    row.innerHTML =
      '<div class="label">' + d.label + '</div>' +
      '<div class="bar-wrap"><div class="bar' + (d.hot ? ' hot' : '') + '" style="width:' + w + '%"></div>' +
      '<div class="val" style="left:calc(' + w + '% + 10px)">约 ' + d.v + ' 次</div></div>';
    chart.appendChild(row);
  });
</script>
</body>
</html>
