<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图片尾巴 · 点赞收藏引导</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0c0d0f;
    font-family: "Outfit", "PingFang SC", "Hiragino Sans GB", sans-serif;
    display: flex; justify-content: center; padding: 40px;
  }
  #tail {
    width: 1200px;
    background: linear-gradient(135deg, #17181d 0%, #101114 60%, #15130d 100%);
    border: 1px solid #26282e;
    border-radius: 20px;
    padding: 34px 44px 30px;
    position: relative;
    overflow: hidden;
  }
  /* 背景装饰：右上角琥珀光晕 + 电路线条 */
  #tail::before {
    content: "";
    position: absolute; top: -90px; right: -60px;
    width: 320px; height: 320px; border-radius: 50%;
    background: radial-gradient(circle, rgba(245,158,11,.16) 0%, transparent 70%);
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 24px; }

  .left { flex: 1; min-width: 0; }
  .tag {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px; letter-spacing: 2.5px;
    color: #f59e0b;
    display: flex; align-items: center; gap: 8px;
  }
  .tag::before { content: ""; width: 20px; height: 2px; background: #f59e0b; }
  .headline {
    margin-top: 10px;
    font-size: 30px; font-weight: 800; color: #f3f4f6; letter-spacing: 1px;
  }
  .headline em { font-style: normal; color: #f59e0b; }
  .sub {
    margin-top: 8px;
    font-size: 14.5px; color: #8b8e98; line-height: 1.6;
  }
  .sub b { color: #c9ccd4; font-weight: 600; }

  /* 右侧三个动作 */
  .actions { display: flex; gap: 14px; flex-shrink: 0; }
  .act {
    background: #191b1f;
    border: 1px solid #2a2d33;
    border-radius: 14px;
    padding: 16px 18px 13px;
    text-align: center;
    width: 128px;
  }
  .act .icon { font-size: 26px; line-height: 1; }
  .act .label {
    margin-top: 8px;
    font-size: 15px; font-weight: 600; color: #e5e7eb;
  }
  .act .hint {
    margin-top: 3px;
    font-size: 11px; color: #6b6e78;
  }
  .act.hot { border-color: rgba(245,158,11,.45); background: #1c1a14; }
  .act.hot .label { color: #f59e0b; }

  /* 底部金句签名 */
  .foot {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px dashed #2a2d33;
    display: flex; align-items: center; justify-content: space-between;
  }
  .motto {
    font-family: "JetBrains Mono", monospace;
    font-size: 12.5px; color: #6b6e78; letter-spacing: 1px;
  }
  .motto b { color: #f59e0b; font-weight: 700; }
  .brand { font-size: 12px; color: #4b4e57; letter-spacing: 2px; }
</style>
</head>
<body>
  <div id="tail">
    <div class="row">
      <div class="left">
        <div class="tag">BEFORE YOU GO</div>
        <div class="headline">整理不易，如果对你有<em>启发</em></div>
        <div class="sub">欢迎点赞、收藏——<b>买之前翻出来对照着查一遍</b>；<br>也欢迎在评论区聊聊：你踩过多口充电器的什么坑？</div>
      </div>
      <div class="actions">
        <div class="act">
          <div class="icon">👍</div>
          <div class="label">点赞</div>
          <div class="hint">让更多人看到</div>
        </div>
        <div class="act hot">
          <div class="icon">⭐</div>
          <div class="label">收藏</div>
          <div class="hint">下单前对照查</div>
        </div>
        <div class="act">
          <div class="icon">💬</div>
          <div class="label">评论</div>
          <div class="hint">聊聊你踩的坑</div>
        </div>
      </div>
    </div>
    <div class="foot">
      <div class="motto">// 功率决定上限，<b>协议决定下限</b></div>
      <div class="brand">多口充电器选购指南</div>
    </div>
  </div>
</body>
</html>
