<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>拯救者 Y700 五代 参数卡</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f5f6f7;
      padding: 40px;
      color: #1a1a1a;
    }
    .container { max-width: 720px; margin: 0 auto; }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      gap: 16px;
    }
    .name { font-size: 24px; font-weight: 700; line-height: 1.3; }
    .subtitle { font-size: 14px; color: #666; margin-top: 4px; }
    .price {
      font-size: 28px;
      font-weight: 700;
      color: #e02e24;
      white-space: nowrap;
    }
    .main {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .img-wrap {
      width: 180px;
      flex-shrink: 0;
      text-align: center;
    }
    .img-wrap img {
      width: 160px;
      height: 160px;
      object-fit: contain;
      background: #f8f8f8;
      border-radius: 12px;
    }
    .img-placeholder {
      width: 160px;
      height: 160px;
      margin: 0 auto;
      background: #f0f0f0;
      color: #999;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      line-height: 1.4;
    }
    .specs {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px 16px;
      font-size: 14px;
    }
    .spec-item {
      background: #f8f8f8;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .spec-item .label {
      color: #888;
      font-size: 12px;
      display: block;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div>
          <div class="name">拯救者 Y700 五代</div>
          <div class="subtitle">8.8 英寸</div>
        </div>
        <div class="price">¥3799</div>
      </div>
      <div class="main">
        <div class="img-wrap">
          <img src="https://p3.lefile.cn/product/adminweb/2026/03/18/XXLB1oXsHbk7rW8i6HJYJHG6W-0291.png" alt="拯救者 Y700 五代">
        </div>
        <div class="specs">
          <div class="spec-item"><span class="label">处理器</span>第五代骁龙 8 至尊版</div>
          <div class="spec-item"><span class="label">屏幕</span>8.8 英寸 3040×1904 165Hz</div>
          <div class="spec-item"><span class="label">内存 / 存储</span>12GB+256GB / 16GB+512GB</div>
          <div class="spec-item"><span class="label">电池</span>9000mAh（典型值）/ 68W</div>
          <div class="spec-item"><span class="label">重量</span>约 360g</div>
          <div class="spec-item"><span class="label">尺寸</span>约 206×128.5×6.2mm</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
