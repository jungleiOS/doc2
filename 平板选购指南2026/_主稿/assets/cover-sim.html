<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>封面 · 平板插卡篇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #F5F3EC;
    font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
  }
  #shot {
    width: 690px; height: 280px;
    background-color: #F5F3EC;
    background-image:
      linear-gradient(#E9E5D6 1px, transparent 1px),
      linear-gradient(90deg, #E9E5D6 1px, transparent 1px);
    background-size: 26px 26px;
    border: 1px solid #DDD8C9;
    position: relative;
    overflow: hidden;
    padding: 30px 36px;
    display: flex;
  }
  .left { flex: 1; display: flex; flex-direction: column; }
  .eyebrow {
    font-family: "Menlo", monospace;
    font-size: 11px; letter-spacing: 2px; color: #5B6875;
    display: flex; align-items: center; gap: 8px;
  }
  .eyebrow::before { content: ""; width: 20px; height: 2px; background: #B93A27; }
  h1 {
    margin-top: 14px;
    font-family: "Songti SC", "STSong", serif;
    font-weight: 900;
    font-size: 40px; color: #22303E;
    line-height: 1.18;
  }
  h1 .six {
    color: #B93A27;
    font-size: 88px;
    line-height: .9;
    vertical-align: -14px;
    margin: 0 2px;
  }
  .sub {
    margin-top: 14px;
    font-size: 14px; color: #5B6875;
  }
  .sub b { color: #22303E; font-weight: 600; }
  .sig {
    margin-top: auto;
    font-family: "Menlo", monospace;
    font-size: 10px; color: #98A0A8; letter-spacing: 1px;
  }
  .right {
    flex: 0 0 210px;
    border-left: 1px dashed #C9C3B2;
    margin-left: 28px; padding-left: 22px;
    display: flex; flex-direction: column; justify-content: center; gap: 10px;
  }
  .item {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 12.5px; color: #3D4A57;
  }
  .item .no {
    font-family: "Songti SC", serif;
    font-weight: 700; font-size: 14px; color: #B93A27;
    flex: 0 0 16px;
  }
  .right .cap {
    font-family: "Menlo", monospace;
    font-size: 9.5px; color: #98A0A8; letter-spacing: 1.5px;
    margin-bottom: 2px;
  }
  .corner {
    position: absolute; right: 14px; top: 12px;
    font-family: "Menlo", monospace;
    font-size: 9.5px; color: #B4AA93; letter-spacing: 1px;
  }
</style>
</head>
<body>
<div id="shot">
  <div class="corner">FIELD NOTES · 2026-09</div>
  <div class="left">
    <div class="eyebrow">系列拆文 A · 插卡专项 · 7 品牌 26 款全查完</div>
    <h1>能插卡打电话的平板<br><span class="six">6</span> 台都不到</h1>
    <div class="sub">2026 平板选购指南 · <b>先把特权确认在，再谈买哪台</b></div>
    <div class="sig">Apple研究生 · 数据快照 2026-09</div>
  </div>
  <div class="right">
    <div class="cap">插卡三要素</div>
    <div class="item"><span class="no">壹</span>实体 SIM 还是 eSIM</div>
    <div class="item"><span class="no">贰</span>4G 还是 5G</div>
    <div class="item"><span class="no">叁</span>能不能打电话</div>
    <div class="item"><span class="no">肆</span>荣耀/vivo 全系不用问</div>
  </div>
</div>
</body>
</html>
